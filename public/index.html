<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="home.css"/>
    <link rel="stylesheet" href="https://use.typekit.net/vkl5kng.css">
    <title>Title</title>
</head>
<body>
<div id="cont">

    <input type="text" id="playerInput" placeholder="room name..." autocomplete="off" maxlength="20">
    <div onclick="createRoom()"  id="create">
        <p>create or join room</p>
    </div>
</div>
<div id="info">
    <p>This is a valorant fan project! not at all associated with Riot Games!</p>
</div>
<div id="container">
    <img
            id="backgroundIndex"
            src="images/background-background.webp"
            style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        object-fit: cover;
        pointer-events: none;
        display: block;
        scale: 102%;
      "
    />

    <img
            id="backgroundIndex2"
            src="images/background-foreground.webp"
            style="
        position: fixed;
        top: -2vw;
        left: -4vw;
        width: 110%;
        height: 110%;
        z-index: 1;
        object-fit: cover;
        pointer-events: none;
        display: block;

      "
    />
</div>


<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

<script>
    const socket = io();

    const input = document.getElementById('playerInput');

    createRoom = () => {
        const roomName = input.value;

        if (!roomName) {
            alert("Please enter a room name!");
            return;
        }

        socket.emit("joinRoom", roomName);
    }

    socket.on("roomJoined", (roomName) => {
        console.log("Joined room:", roomName);
        // Redirect to game page      // Pass room name in URL
        window.location.href = `game.html?room=${roomName}`;
    });


</script>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="plugins/gsap.min.js"></script>
<script src="index.js"></script>
</html>
