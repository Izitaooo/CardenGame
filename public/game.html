<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ImDraggingIt</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.cdnfonts.com/css/valorant" rel="stylesheet" />
    <link rel="stylesheet" href="https://use.typekit.net/vkl5kng.css">
  </head>
  <body>
  <div id="enemyPlaying"></div>
  <div id="youPlaying"></div>
    <div id="agentSelectMenuBackground">
      <h2 id="agentSelectH2">Choose your agents</h2>
      <div id="agentContainer">
        <div class="agentSelect" id="clove">
          <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
        <div class="agentSelect" id="iso">
          <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
        <div class="agentSelect" id="jett">
          <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
        <div class="agentSelect" id="omen">
          <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
        <div class="agentSelect" id="sage">
          <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
        <div class="agentSelect" id="skye">
        <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
        <div class="agentSelect" id="sova">
          <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
        <div class="agentSelect" id="vyse">
          <div class="glint"></div>
          <div class="agentHealth">10</div>
        </div>
      </div>
        <button id="lockIn" onclick="lockIn()">Lock in</button>
        <p id="waitForPlayerText">wait for second player to join</p>
    </div>
    <img
      id="background"
      src="images/background@2x.webp"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        object-fit: cover;
        pointer-events: none;
      "
    />
    <img
      id="border"
      src="images/border@2x.png"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        box-shadow: 0 0 200px rgba(0,0,0,0.9) inset;
      "
    />
    <p id="roomNameText" style="text-align: end; position: fixed; right: 2vw">
      room:
    </p>
    <div onclick="spawnMenu()" id="shopBtnCnt">
      <p id="shopText">Shop Here</p>
    </div>
    <div class="container"></div>
    <div id="container2">
      <div class="drop" id="drop1"></div>
      <div class="drop" id="drop2"></div>
      <div class="drop" id="drop3"></div>
      <div class="drop" id="drop4"></div>
      <div class="drop" id="drop5"></div>
      <div class="drop" id="drop6"></div>
    </div>
    <div class="slidecontainer">
      <input type="range" min="0.0" max="1" value="0.15" step="0.01" class="slider" id="volume">
    </div>
    <div id="endRound" onclick="roundOver()" >Agartha</div>
    <div id="switchPlayer" onclick="switchPlayer()" >switchPlayer</div>

    <div id="bottomholder">
      <div id="bottomhitbox">
        <div id="hand"></div>
      </div>
    </div>
    <div id="shopMenu">
      <div id="shopContainer">
        <div id="buttonHolder">
          <div id="sidearms">
            <div class="category">SIDEARMS</div>
            <button draggable="true" ondragstart="spawnCard(event)" id="randBtn" class="spawnButtons">
              <span>spawnRand</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="300" id="shortyBtn" class="spawnButtons">
              <span class="priceWpn">300c</span>
              <span class="nameWpn">SHORTY</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="450" id="frenzyBtn" class="spawnButtons">
              <span class="priceWpn">450c</span>
              <span class="nameWpn">FRENZY</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="500" id="ghostBtn" class="spawnButtons">
              <span class="priceWpn">500c</span>
              <span class="nameWpn">GHOST</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="800" id="sheriffBtn" class="spawnButtons">
              <span class="priceWpn">800c</span>
              <span class="nameWpn">SHERIFF</span>
            </button>
          </div>

          <div id="sNs">
            <div class="category">SMGS</div>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="1100" id="stingerBtn" class="spawnButtons">
              <span class="priceWpn">1100c</span>
              <span class="nameWpn">STINGER</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="1600" id="spectreBtn" class="spawnButtons">
              <span class="priceWpn">1600c</span>
              <span class="nameWpn">SPECTRE</span>
            </button>

            <div class="category">SHOTGUNS</div>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="850" id="buckyBtn" class="spawnButtons">
              <span class="priceWpn">850c</span>
              <span class="nameWpn">BUCKY</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="1850" id="judgeBtn" class="spawnButtons">
              <span class="priceWpn">1850c</span>
              <span class="nameWpn">JUDGE</span>
            </button>
          </div>

          <div id="rifles">
            <div class="category">RIFLES</div>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="2050" id="bulldogBtn" class="spawnButtons">
              <span class="priceWpn">2050c</span>
              <span class="nameWpn">BULLDOG</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="2250" id="guardianBtn" class="spawnButtons">
              <span class="priceWpn">2250c</span>
              <span class="nameWpn">GUARDIAN</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="2900" id="phantomBtn" class="spawnButtons">
              <span class="priceWpn">2900c</span>
              <span class="nameWpn">PHANTOM</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="2900" id="vandalBtn" class="spawnButtons">
              <span class="priceWpn">2900c</span>
              <span class="nameWpn">VANDAL</span>
            </button>
          </div>

          <div id="heavies">
            <div class="category">SNIPER RIFLES</div>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="950" id="marshalBtn" class="spawnButtons">
              <span class="priceWpn">950c</span>
              <span class="nameWpn">MARSHAL</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="2400" id="outlawBtn" class="spawnButtons">
              <span class="priceWpn">2400c</span>
              <span class="nameWpn">OUTLAW</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="4700" id="operatorBtn" class="spawnButtons">
              <span class="priceWpn">4070c</span>
              <span class="nameWpn">OPERATOR</span>
            </button>

            <div class="category">MACHINE GUNS</div>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="1600" id="aresBtn" class="spawnButtons">
              <span class="priceWpn">1600c</span>
              <span class="nameWpn">ARES</span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" data-price="3200" id="odinBtn" class="spawnButtons">
              <span class="priceWpn">3200c</span>
              <span class="nameWpn">ODIN</span>
            </button>
          </div>
        </div>
        <div id="abilityHolder">
          <div class="category">ABILITIES</div>
          <div id="abilities">
            <div id="agentBtn">
              <div id="arrows">
                <div id="left" class="arrow"></div>
                <div id="middle" class="arrow"></div>
                <div id="right" class="arrow"></div>
              </div>
            </div>
            <button draggable="true" ondragstart="spawnCard(event)" id="ab1" class="spawnButtons">
              <span class="priceWpn">1600c</span>
              <span class="nameWpn"></span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" id="ab2" class="spawnButtons">
              <span class="priceWpn">1600c</span>
              <span class="nameWpn"></span>
            </button>
            <button draggable="true" ondragstart="spawnCard(event)" id="ab3" class="spawnButtons">
              <span class="priceWpn">1600c</span>
              <span class="nameWpn"></span>
            </button>
          </div>
        </div>
      </div>
      <div id="luh">
        <div id="luhText">DRAG HERE!</div>
        <div id="money">C</div>
      </div>
      <div class="close heavy pointy"></div>
    </div>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <script src="plugins/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
